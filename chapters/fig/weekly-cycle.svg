<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <text x="30" y="28" font-size="15" fill="currentColor" opacity="0.75">The weekly combat adaptation cycle (Ukraine, 2022–2026)</text>
  <defs>
    <marker id="hw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="0,0 8,4.5 0,9" fill="currentColor"/>
    </marker>
  </defs>
  <g font-size="13" text-anchor="middle">
    <rect x="190" y="55" width="260" height="52" rx="8" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="320" y="76" fill="currentColor">Week N — frontline fields</text>
    <text x="320" y="94" fill="currentColor" opacity="0.7">analog FPV drones, 5.8 GHz</text>
    <rect x="190" y="135" width="260" height="52" rx="8" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="320" y="156" fill="currentColor">Week N+1 — high-power</text>
    <text x="320" y="174" fill="currentColor" opacity="0.7">trench jammers, 5.8 GHz</text>
    <rect x="190" y="215" width="260" height="52" rx="8" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="320" y="236" fill="currentColor">Week N+2 — control shifts to</text>
    <text x="320" y="254" fill="currentColor" opacity="0.7">dynamic 915 MHz ELRS</text>
    <rect x="190" y="295" width="260" height="52" rx="8" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="320" y="316" fill="currentColor">Week N+3 — broad-spectrum</text>
    <text x="320" y="334" fill="currentColor" opacity="0.7">digital noise sweeps</text>
    <rect x="170" y="375" width="300" height="52" rx="8" fill="#f87171" fill-opacity="0.12" stroke="#f87171" stroke-width="1.5"/>
    <text x="320" y="396" fill="currentColor">Week N+4 — fiber-spooled FPV:</text>
    <text x="320" y="414" fill="currentColor" opacity="0.7">the spectrum is abandoned, not won</text>
  </g>
  <g stroke="currentColor" stroke-width="1.5" marker-end="url(#hw)">
    <line x1="320" y1="107" x2="320" y2="130"/>
    <line x1="320" y1="187" x2="320" y2="210"/>
    <line x1="320" y1="267" x2="320" y2="290"/>
    <line x1="320" y1="347" x2="320" y2="370"/>
  </g>
  <path d="M 495 401 C 560 380, 560 120, 462 88" fill="none" stroke="#f87171" stroke-width="1.5" marker-end="url(#hw)"/>
  <text x="560" y="250" font-size="12" fill="#f87171" text-anchor="middle">next</text>
  <text x="560" y="266" font-size="12" fill="#f87171" text-anchor="middle">cycle:</text>
  <text x="560" y="282" font-size="12" fill="#f87171" text-anchor="middle">~7 days</text>
  <text x="30" y="455" font-size="12" fill="currentColor" opacity="0.65">Fig. 2 — Adaptation, not acquisition, is the weapon. No committee writes a Statement of Work at this speed.</text>
</svg>
